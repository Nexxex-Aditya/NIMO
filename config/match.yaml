# P9 matcher — specs/match.md §4.
#
# `04` §9: zero magic numbers in code. Every weight below is a named config
# value rather than a literal in a scoring function.
#
# ****** THESE WEIGHTS ARE NOT TUNED. ******
#
# `03` §4 stage 4 says thresholds are tuned against the gold set, not
# hand-picked — and the gold set is 5 URLs, of which ZERO have a usable GTIN
# (`specs/match.md` §1). Fitting weights against five points would produce
# numbers that look measured and are not, which is the exact failure this
# project has caught three times already.
#
# So they are set from the ORDERING of evidence strength that `03` §4 stage 4
# states, and marked untuned. P10 tunes them when there is something to tune
# against. Anyone reading a score before then should read it as a ranking, not
# as a quantity.

weights:
  # Brand is the strongest non-GTIN signal: a page for a different brand is a
  # different product regardless of how well the rest matches.
  brand_match: 0.35

  # What discriminates INSIDE a brand+size block — the same role variant terms
  # play for the registry's Tier 1 (`03` §1a), where they were measured to be
  # the only thing separating Aquafresh Extra Care from Intense Clean.
  variant_overlap: 0.30

  # "pump", "spray", "tablets" — a real identity attribute, but coarser than
  # variant terms and absent on 160 of 412 dev rows.
  format_consistent: 0.15

  # A boots.com page for a Boots row is corroboration, not proof: the same
  # product legitimately appears on many retailers, and `01` §5 shows the
  # organizers' own answer crossing retailer AND market.
  retailer_domain_match: 0.10

  # SCORED, NEVER A FILTER. `01` §5: the reference answer resolves a FR,GB
  # item to Amazon.in, so a country hard-filter rejects it. `04` §12 lists a
  # country hard-filter as a forbidden pattern. [PROVISIONAL - Q4]
  market_signal: 0.10

# --- Hard-rule penalties (`03` §4 stage 4) ---------------------------------
#
# Demotions, not rejections. `03` §4 stage 4: "Size mismatch where both sizes
# are confidently parsed -> hard demotion, not rejection (retailer pages
# sometimes list a range)." A demoted candidate can still win when nothing
# better exists — which matters, because 4 of 10 measured pages are bot walls
# carrying no evidence at all.
penalties:
  size_mismatch: 0.60
  count_mismatch: 0.60      # multipack count is a HARD identity attribute (`03` §4 stage 0)
  negative_flag: 0.40       # per flag, capped by the floor below

# A demoted candidate never goes below this, so it stays rankable rather than
# becoming indistinguishable from a rejected one. Rejection is a separate,
# explicit outcome — only the conflicting-GTIN rule produces it.
score_floor: 0.01

# --- Negative flags (`03` §4 stage 4) --------------------------------------
#
# Present on the page and absent from the query means the page is probably a
# different SKU: a refill pack is not the complete pack, a travel size is not
# the full size. Symmetric by construction — the check is "page has it, query
# does not", so a query that IS a refill is not penalised for matching one.
negative_flags:
  - refill
  - refills
  - travel
  - sample
  - bundle
  - gift set
  - giftset
  - multipack
  - value pack
  - trial

# --- Listing pages are not product pages ----------------------------------
#
# Measured on the first live run of the full pipeline (2026-09-11): 2 of 5
# qa rows selected an Amazon SEARCH RESULTS page (`/s?k=oral+b+toothbrush`)
# as "the product". A listing mentions the brand, the size and every variant
# term at once — which is exactly why the weighted features like it — and
# identifies no product at all. Demoted through the same machinery as
# `refill`/`bundle`: it is a page for the wrong THING, not a wrong variant.
#
# URL shapes, matched case-insensitively against the candidate URL. Kept to
# unambiguous search/listing markers; a product URL that happens to contain
# `search` in a slug would be a false demotion, so bare words are avoided.
listing_url_patterns:
  - "/s?k="          # amazon search
  - "/s/"            # amazon search (path form)
  - "/search?"       # generic
  - "/search/"       # generic path form
  - "?q="            # generic query
  - "?query="
  - "/catalogsearch/"  # magento
  - "/results?"
  - "/sr?"           # ebay-style
  - "/sch/"          # ebay search
  - "/b/bn_"         # ebay category browse — qa:2 fell through to one once amazon's listing was demoted
  # Added 2026-09-11 from the full qa run's 412 selections:
  - "_nkw="          # ebay shop search (`/shop/poligrip?_nkw=poligrip`) — 4 selections
  - "/bn_"           # ebay browse node anywhere in the path (`/b/Binaca/260781/bn_7023344978`)
  - "/collections/"  # shopify collection listing (`/collections/aquafresh`) — 6 selections

# --- Directory and price-comparison domains -----------------------------------
#
# Pages ABOUT the product that are not the product's page: barcode
# directories and price aggregators. They publish the GTIN — which is why
# the matcher likes them and why they still count as calibration evidence —
# but a retailer or manufacturer page is the digital representation the brief
# asks for. Measured on the full qa run: 70 of 412 selections (17%) were
# `grocefully.com` (39), `buycott.com` (24) or `prodlookup.co.uk` (7).
# DEMOTED through the same `directory` flag machinery as `refill`, never
# rejected: when no retailer page was fetched, the directory page still wins.
# Host suffix match, so subdomains count.
directory_domains:
  - buycott.com
  - grocefully.com
  - prodlookup.co.uk
  - barcodelookup.com
  - barcodeindex.com
  - upcitemdb.com
  - go-upc.com
  - ean-search.org
  - barcode-list.com
  - 123pricecheck.com
  - pricerunner.com
  - idealo.co.uk
  - pricespy.co.uk
  - callchecker.co.uk
  - cosmos.bluesoft.com.br   # surfaced by the rescoring itself (`qa:4`)

# --- Page-side parsing -----------------------------------------------------
#
# How much page text to run P3's parser over. The title carries the product
# identity; body text on a real page runs to hundreds of KB and is mostly
# navigation, reviews and cross-sells, which would swamp the variant overlap
# with unrelated brand names.
page_text_chars: 300

# --- P11 LLM adjudication (`specs/adjudicate.md`) -----------------------------
#
# Tier 3 runs only when Layer A could not separate the top candidates. Every
# number here is [PROVISIONAL]: untuned until the gate procedure in
# `specs/adjudicate.md` §8 has been run on the NIQ network.
adjudication:
  # `03` §4 stage 4: "Invoked when runner_up_gap < threshold". The gap is a
  # difference of raw scores in [0, 1]. 0.15 is a starting point, not a
  # measurement: on the first live rows the winning gaps ran 0.02-0.4.
  runner_up_gap_threshold: 0.15
  # How many of the top usable candidates the model sees. `03` says 3-5.
  top_k: 4
  # Per candidate, how much boilerplate-stripped body text goes into its
  # untrusted block. The title and JSON-LD carry the identity; body text is
  # mostly navigation and cross-sells, and every character is a token.
  body_text_chars: 600
  # The rationale is a citation for stage 7, not chain-of-thought (`04` §7).
  max_rationale_chars: 400
