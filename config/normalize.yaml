# P3 normalizer vocabularies — specs/normalize.md §1c, §4, §5.
#
# Config rather than code constants because `04` §9 puts vocabularies and
# tunables here, and because these are the parts a later phase may genuinely
# want to extend (a new format, a new unit-of-sale code) without touching
# parsing logic.
#
# NOT here, deliberately: the retailer-derived junk tokens (§1a). Those are
# derived per-row from that row's own RETAILER value — 824/824 rows measured —
# so there is nothing to list. A static list would rot and could strip a token
# that is legitimate content on a different row.

# §1c — unit-of-sale codes. Standalone tokens only.
# Measured occurrence counts across 824 dev+qa rows are in the comments.
unit_of_sale_tokens:
  - each   # 48 rows
  - ea     # 13
  - sgl    # 17
  - std    # 15
  - u      # 18
  - pmp    # 2

# Deliberately absent from the list above, and this is load-bearing:
#   `free`  (43 rows) — "alcohol free", "fluoride-free", "sugar-free"
#   `extra` (31 rows) — "extra soft", "extra hard"
# Both are real product content in this dataset and sit in the same frequency
# band as the junk above, which makes them easy to sweep up by accident.
# Stripping them would destroy the variant signal `03` §4 stage 4 scores on.

# §3 — words that turn "N x" into a marketing claim rather than a multipack
# multiplier. Measured: of 11 `N x` occurrences across dev+qa, exactly 3 are
# claims — "3x more effective", "4x more effective", "2x stronger enamel" —
# and all 3 are followed by a comparative. The other 8 are genuine
# multipliers followed by a size ("10 x 15ml", "2 x 150g") or a product noun
# ("12x wisdom", "2x replacement heads", "1x usb cable"), which is why the
# rule keys off the *following* word rather than trying to whitelist shapes.
# Without this, "2x stronger enamel defence" parses as a 2-pack.
multiplier_claim_words:
  - more
  - less
  - stronger
  - longer
  - better
  - whiter
  - faster
  - cleaner
  - softer
  - harder
  - brighter
  - healthier
  - smoother
  - deeper

# §4 — format hints. A genuinely closed, small set; feeds
# MatchFeatures.format_consistent (P9). Seeded from measured token frequency.
format_hints:
  - pump        # 31 rows
  - gel         # 14
  - tablets     # 13
  - rinse       # 13
  - paste
  - powder
  - spray
  - foam
  - floss
  - tape
  - strips
  - sachets
  - wipes
  - capsules
  - lozenges
  - gum
  - mouthwash
  - mouthrinse
  - toothpaste
  - toothbrush

# §5 — stopwords removed from variant_terms. Function words plus the unit and
# packaging words already captured structurally by size/count parsing, so they
# do not also leak into the variant vocabulary as noise.
stopwords:
  - of
  - for
  - and
  - with
  - the
  - to
  - de
  - a
  - in
  # QUOTED, and it must stay quoted. YAML 1.1 parses bare `on` as the
  # BOOLEAN True (so do `off`, `yes`, `no`). Unquoted, this entry became
  # `True`, the loader stringified it to "true", and the stopword "on" was
  # never stripped — visible downstream as junk in query construction
  # ("ULTRADEX one go on liquid 15ml"). `05` §5 type coercion across a
  # serialization boundary, in our own config. `vocab.py` now rejects a
  # non-string entry loudly rather than stringifying it.
  - "on"
  - pack
  - packs
  - count
  - ct
  - ml
  - g
  - x
