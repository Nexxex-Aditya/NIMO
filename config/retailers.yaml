  name: POSITIVE SOLUTIONS LTD
  domain: null
"E00N3 (GB) CWS CENSUS":
  # CWS = Co-operative Wholesale Society; CENSUS is the audit-type qualifier.
  # Domain deliberately unset: the co-op grocery site is a plausible but
  # unverified mapping for an audit feed, and a wrong site: filter is worse
  # than none.
  name: CWS
  domain: null
