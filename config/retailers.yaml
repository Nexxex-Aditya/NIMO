# retailer_raw (exact RETAILER column value) -> {name, domain}
#
# Hand-reviewed, all 50 entries, per `specs/loader.md` §4 and `01` §12.
# NOT regex-derived-and-spot-checked: the obvious regex was measured against
# these exact 50 values and fails on 21 (42%), one of them silently
# ("BOOTS (GB) (HOMESCAN)" -> "(HOMESCAN)", discarding the largest retailer
# in the dataset). Every entry below was reviewed individually.
#
# Review rule applied to `name`:
#   1. Drop the NIQ code prefix ("E0028 ", "P00R4 ", ...).
#   2. Drop the country parenthetical ("(GB)", "(UK)").
#   3. Collapse whitespace.
#   4. Drop NIQ panel/feed qualifiers that are not part of the trading name
#      (HOMESCAN, EPOS, CENSUS, NEW, NEW FEED, TRAVEL, OMNI, ESA). Each such
#      entry is commented with what was dropped, so the judgement is auditable
#      rather than implicit.
#
# Review rule applied to `domain`:
#   Filled only where the entry is a real UK consumer storefront that can be
#   identified with confidence. Left `null` for audit/panel feeds, data
#   providers, internal labels, manufacturer shipment feeds, and retailers
#   that no longer trade. `null` is safe: `03` §4 stage 2 skips strategy S4
#   for unmapped retailers rather than guessing a site: filter. A wrong domain
#   would silently poison retrieval for every row of that retailer, so an
#   uncertain domain is deliberately left unset — `domain` may stay partial
#   until P7 (`specs/scaffold.md`), `name` may not.
#
# KEYS ARE EXACT RAW STRINGS. Two of them carry trailing whitespace
# ("WILKINSON ", "E00E2 (GB) SOMERFIELD ", "E00I1 (GB)  T & S EPOS ") and one
# carries a double space. They are quoted for that reason — do not "tidy" them,
# the key must match the cell value byte-for-byte or the loader raises.

"P00R4 (GB) BOOTS":
  name: BOOTS
  domain: boots.com
"BOOTS (GB) (HOMESCAN)":
  # Sentinel case. A naive regex captures "(HOMESCAN)" here and throws BOOTS
  # away. Homescan is an NIQ consumer-panel feed, not a retailer name.
  name: BOOTS
  domain: boots.com
"AMAZON (GB)":
  name: AMAZON
  domain: amazon.co.uk
"AMAZON NEW (GB)":
  # "NEW" is a feed qualifier; same retailer as "AMAZON (GB)".
  name: AMAZON
  domain: amazon.co.uk
"BRANDBANK (UK)":
