# SearxNG instance config for NIMO — specs/retrieval.md §5.
#
# The one setting the pipeline actually depends on is `search.formats`
# including `json`: SearxNG ships with HTML only, and without JSON the client
# gets a 200 with an HTML body and no `results` key. `_parse_results` raises a
# message naming this file for exactly that reason.

use_default_settings: true

general:
  instance_name: "nimo-local"
  # No public instance, no external contact point — this is a local,
  # single-user index (`03` §4 stage 2).
  donation_url: false
  contact_url: false

search:
  # REQUIRED. Without `json` here the client cannot parse anything.
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""
  default_lang: "en-GB"

server:
  # Overridden by the compose environment; kept so the file is valid standalone.
  base_url: "http://localhost:8080/"
  limiter: false          # single local user; the limiter would throttle us
  image_proxy: false
  method: "GET"

ui:
  default_locale: "en"

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  pool_connections: 20
  pool_maxsize: 10

# --- Engine selection, measured 2026-09-11 ---------------------------------
#
# Probed each engine with four real product queries from the dev sheet, paced
# 2s apart so the probe would not cause the blocking it was measuring:
#
#   engine       blocked  results/q  relevant   note
#   brave           0/4      20.0       95%
#   startpage       0/4      34.8       91%
#   bing            0/4      10.0       25%
#   mojeek          0/4       0.0        -      disabled by default
#   duckduckgo      4/4         -         -     CAPTCHA
#   qwant           4/4         -         -     CAPTCHA
#   google          4/4         -         -     Suspended: CAPTCHA
#   yahoo           4/4         -         -     parsing error
#
# Google, DuckDuckGo and Qwant CAPTCHA-block a single IP within a few dozen
# queries and are therefore unusable as a primary source for a 400+ row run,
# regardless of their result quality. They stay available for manual use in
# the UI but are not in the pipeline's engine list (`config/retrieval.yaml`).
#
# Mojeek is enabled here because it runs a genuinely INDEPENDENT index (not a
# Bing/Google reseller), which is what makes it worth having: if Brave and
# Startpage ever correlate in a block, Mojeek is unlikely to correlate with
# them.
engines:
  - name: mojeek
    disabled: false
  - name: bing
    disabled: false

