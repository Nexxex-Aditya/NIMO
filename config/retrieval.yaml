# P7 candidate generation — specs/retrieval.md.
#
# `04` §9: zero magic numbers in code. Every value a later phase might want to
# change lives here.

# §6 — "Target 10-20 unique candidates. Cap hard; more costs fetch budget for
# no gain" (`03` §4 stage 2). 20 is the hard cap on the RECORDED list — the
# trace and the retrieve artifact never hold more than this.
max_candidates: 20

# How many of those candidates the runner actually fetches, per row. Was a
# constant in `run/__main__.py`; lives here because it is the number the
# query budget is really governed by (`specs/retrieval.md` §5a.7): the
# candidate list is ordered (strategy order, rank), so once this many safe
# unique candidates exist, NO later strategy can enter the fetched set, and
# every further query is spent on candidates that are never looked at.
# Measured on the first 8 harvested qa rows: S3 and S5 produced 86 candidates
# and 0 of them were fetched. Early exit (below) fires at this number.
fetch_budget: 8

# Per-strategy result limit, before merging and the global cap above. Kept
# below max_candidates so no single strategy can fill the whole budget and
# starve the others — S5 (verbatim description) is the most likely to return
# 20 mediocre results and crowd out a barcode-exact hit.
per_strategy_limit: 8

# Strategy order. Merged results keep the FIRST strategy that produced a URL
# as their provenance, and rank by (strategy order, rank within strategy) —
# so the first strategy that fills `fetch_budget` decides what gets fetched
# (`specs/retrieval.md` §6, §5a.7).
#
# Measured availability (`specs/retrieval.md` §2):
#   S1/S2  dev  18/412 (4%)   qa 412/412 (100%)   <- the dev/qa asymmetry
#   S3     dev 225/412        qa 220/412
#   S4     dev 223/412 (54%)  qa 256/412 (62%)    <- 28 of 50 retailers mapped
#   S5     dev 412/412        qa 412/412
#
# S1 (bare barcode) is LAST, not first, as of 2026-09-11 — `03` §4 stage 2
# lists it first and this is a measured correction (`specs/retrieval.md`
# §5a.7). Over the 10 harvested qa rows, from the search cache: S2 (barcode
# + brand) returned 8 results with the brand in the URL or title on 8 of 8
# rows where it ran (brand signal 8/8 on six rows, 7/8, 5/8, 4/8); S1 was
# EMPTY on 5 of 10 rows, returned 1-2 results on 3 (every one also in S2's
# list — `allibhavan.com`, the row `qa:5` GTIN hit, was in S2's results and
# only "owned" by S1 through provenance order), and on the one row where it
# filled the budget (`qa:8`, on Brave) all 8 results were pages that merely
# contain the digit string: `callchecker.co.uk/prefix/0750006`,
# `eveandersson.com/pi/digits/1000000`. That filled the fetch set with junk
# and stopped S2 from running at all. A bare number is a bad query on an
# engine that matches digits; the brand word is what disambiguates it. S1
# stays as the fallback `03` defines, for a row where nothing else fills.
strategy_order: [S2, S3, S4, S5, S1]

# SearxNG engines — names are EXACT and verified against `GET /config`.
#
# ****** CORRECTION 2026-09-11 ******
# An earlier version of this list contained `startpage`. THERE IS NO ENGINE
# CALLED `startpage` IN THIS SEARXNG BUILD. SearxNG does not error on an
# unknown engine name; it silently falls back to its default engine set —
# which includes Bing. So for the whole time `startpage` was configured, the
# pipeline was actually querying `[brave] + defaults`, which is why Bing's
# junk survived being "removed", and why the earlier probe that scored
# "startpage" at 91% relevance was measuring the fallback set and recording
# it under the wrong name. The client now raises if any result carries an
# engine tag that was not requested (`_assert_engines_honoured`), so this
# class of phantom cannot recur silently.
#
# Measured 2026-09-11 with result engine tags VERIFIED, four real product
# queries each, 3s apart:
#
#   engine       queries ok  tags honoured  relevant   note
#   google cse      4/4         60/60          87%     best; never blocked in testing
#   duckduckgo      4/4         40/40          82%     CAPTCHAs under load, recovers
#   brave           0/4           -             -      "Suspended: too many requests" (from probing)
#   mojeek          4/4           -             0%     returns nothing for UK retail
#   bing            -             -            25%     answers a DIFFERENT query; excluded
#
# Brave measured 95% relevant earlier in the day before probing exhausted it.
# All three below are exhaustible; the per-engine breaker below is what keeps
# a run alive when one drops.
engines: [google cse, duckduckgo, brave]

# --- Query budget ----------------------------------------------------------
#
# Stop issuing strategies for a row once `fetch_budget` unique, safe
# candidates have been collected. Under strategy-major ordering that is the
# exact point past which a further query cannot change what gets fetched —
# not a heuristic (`specs/retrieval.md` §5a.7).
#
# HISTORY, kept because both numbers were wrong in instructive ways:
#   - an earlier version exited at `max_candidates` (20) and projected a full
#     qa run at "~1270 queries, ~42 minutes". Measured with the full pipeline:
#     8 rows per cooldown window, then every engine blocked. Half of each
#     row's queries (S3, S5) were buying candidates ranked 9-20 that the
#     runner never fetched.
#   - cross-row query deduplication was measured and deliberately NOT built:
#     1904 of 1904 qa queries are distinct (S5 is the verbatim description,
#     S3 carries per-row variant terms). It would have bought nothing.
#
# Set false to force every strategy for a recall experiment, where the point
# is to measure reach rather than to spend the budget well.
early_exit: true

# --- Engine mode (`specs/retrieval.md` §5a.7) ------------------------------
#
#   portfolio : every request fans out to every available engine at once.
#               Best recall per query; every engine exhausts in lockstep.
#   rotate    : each query goes to ONE engine, cycling through the available
#               ones, so each engine sees a third of the request rate. An
#               EMPTY answer from one engine is not evidence about the others,
#               so on empty the next engine is tried — measured: bare-barcode
#               results come from `google cse` 11 times in 13, and rotating
#               S1 onto DuckDuckGo without that rule would lose the strategy
#               that produced the only GTIN hit. Empties are cached per
#               engine. Per engine, the worst case costs exactly what
#               portfolio mode costs; the common case costs a third.
engine_mode: rotate

# --- Waiting out a fully-broken portfolio ------------------------------------
#
# When every engine is circuit-broken: `false` raises at once (the remaining
# rows fail fast as typed RowFailures — right for a foreground run); `true`
# sleeps until the earliest engine reopens and continues — the only way 412
# rows complete unattended on free engines. Bounded by `max_cooldown_waits`:
# that many consecutive waits with NO successful query in between raises,
# and every later call raises immediately. A portfolio silent for an hour is
# a run to stop and look at, not to keep waiting on.
wait_for_cooldown: true
max_cooldown_waits: 4

# --- Per-engine circuit breaker (`04` §6) ----------------------------------
#
# "N consecutive failures on a domain -> stop hitting it, record the fact,
# continue with other domains." Applied per ENGINE, because that is the unit
# that gets blocked. A CAPTCHA is not a transient error: it means "you are
# rate limited, come back later", so the cooldown is minutes, not the
# sub-second retry backoff below.
engine_failure_threshold: 3      # consecutive CAPTCHAs/errors before opening
engine_cooldown_s: 900           # 15 min before that engine is tried again

# --- Search-result cache (`04` §6 "cache-first") ---------------------------
#
# Content-addressed by (engine set + query). A cache hit issues no request, so
# a re-run costs zero queries and cannot be blocked. This is what makes
# iterating on the matcher affordable, and what lets a partially-blocked run
# be resumed later without redoing the half that succeeded.
cache_enabled: true
cache_ttl_days: 30               # `05` §5 forbids an infinite TTL. Was 14; raised 2026-09-23 to match
                                 # the page cache: the dataset is fixed, and an expired entry on the office
                                 # laptop is a paid Brave call for an answer already held.

# `04` §6 — timeouts ALWAYS set, both halves. A read timeout with no connect
# timeout still hangs forever on a black-holed host.
connect_timeout_s: 5.0
read_timeout_s: 15.0

# `04` §6 — max 3 retries, exponential backoff with jitter, 5xx/timeout only.
max_retries: 3
backoff_base_s: 0.5
backoff_max_s: 8.0

# Politeness toward the upstream engines the local instance fans out to.
#
# Was 0.25s (4 queries/sec). That is what got Google and DuckDuckGo to
# CAPTCHA within a few dozen queries, and the symptom was not an error but
# plausible-looking junk results. 2s x ~412 queries (with early exit) is
# about 14 minutes for a full qa run, which is a fine trade for a run that
# actually finishes.
min_interval_s: 2.0

# --- Search backend -------------------------------------------------------------
#
# `auto`: the Brave Search API when BRAVE_API_KEY is set in .env, else the
# self-hosted SearxNG. The office laptop cannot run Docker (no hardware
# virtualisation, 2026-09-12), so SearxNG cannot run there; the Brave API is
# plain HTTPS. It is cache-first over every answer the free portfolio already
# harvested (`src/nimo/retrieval/brave.py`), so the 412 qa rows cost no credit
# and only a genuinely new query is paid for (`specs/retrieval.md` §5b).
search_backend: auto

brave_api:
  endpoint: https://api.search.brave.com/res/v1/web/search
  country: GB             # `01` §9: GB is the retrieval market; a bias, not a filter
  min_interval_s: 1.0     # the key allows 50/s; nothing here needs more than 1/s
  max_calls_per_run: 150  # paid credits: a runaway becomes a typed failure, not a bill
  max_query_chars: 400    # the API's own limit on `q`

# --- Paid API as backup, NOT primary ---------------------------------------
#
# The seam already exists and is deliberately the only thing that does:
# `merge_candidates` takes a `SearchFn` — `(SearchQuery, int) -> list[
# SearchResult]` — so a paid backend (Brave Search API, Serper, Bing Web
# Search) is a new implementation of that callable plus a key in `.env`, not a
# change to query construction, canonicalization, merging or the cap.
#
# No paid backend is implemented, deliberately: there is no key to test
# against, `04` §6 forbids network calls in tests, and a client written
# against documentation rather than a live endpoint is exactly the class of
# fabricated-and-plausible code that produced the invented Docker tag earlier
# in this project.
#
# What adding one requires, when a key exists:
#   1. `src/nimo/retrieval/<provider>.py` exposing a `SearchFn`
#   2. `<PROVIDER>_API_KEY` in `.env` (gitignored, `04` §9)
#   3. a `backend:` key here, defaulting to `searxng`
#   4. fixture tests via `httpx.MockTransport`, as `test_client.py` already does
#
# The measured position: free engines ARE viable as primary. A paid API is
# insurance against all three portfolio engines correlating in a block, not
# the plan.
