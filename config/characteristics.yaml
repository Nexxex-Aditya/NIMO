# P12 characteristic extraction — specs/characteristics.md.
#
# `04` §9: zero magic numbers in code.

# How much page text goes into the untrusted block, in total. Larger than
# adjudication's 600: ingredients ("contains sodium fluoride 1450ppm"),
# claims ("for sensitive teeth") and pack details live in the body, not the
# title. ~750 tokens at English density.
body_text_chars: 3000

# HOW that budget is spent — measured 2026-09-11 on harvested pages. A plain
# prefix is wrong: on Shopify-style pages the first 3000 characters are
# entirely site navigation (`qa:9`: title at 2744, ingredients later;
# `qa:15`: first relevant word at 9552). So the excerpt is the page prefix
# plus windows around characteristic-relevant anchor terms, merged in page
# order, cut to the budget. On pages where the product text is at the top
# (most retailers) this degenerates to the prefix.
excerpt_prefix_chars: 800
excerpt_window_chars: 220
excerpt_anchor_terms:
  - ingredient
  - fluorid          # fluoride, fluoridated
  - ppm
  - flavour
  - flavor
  - mint
  - sensitiv
  - whiten
  - natural
  - "%"
  - vegan
  - sls
  - alcohol
  - medicated
  - adult
  - child
  - kids
  - baby
  - teen
  - pump
  - tube
  - bottle
  - spray
  - tablet
  - refill
  - pack
  - " ml"
  - bristle
  - soft
  - medium
  - firm
  - head
  - compact
  - plastic
  - glass
  - cardboard
  - paper
  - metal
  - bamboo

# `03` §4 stage 6 step 5: the selected page's pack shot goes to the model
# with the one characteristics call, when a visual characteristic applies.
# Q7: the organizer confirmed 2026-09-11 that the model accepts image input
# ("AFAIK", URL or base64); `python -m nimo.llm --ping-image` is the check.
# The image is fetched through `nimo.fetch.images` (guard, pacing, size cap,
# cache) — at the office it MUST already be in data/cache/images/.
use_image_evidence: true
# The four `03` names; the image is attached only when one of them applies
# to the module, and the prompt lets the model use it for the rest too
# (a pack front states "with fluoride" and the flavour as often as not).
visual_characteristics:
  - GLOBAL_PACKAGING_MATERIAL
  - GLOBAL_BRISTLE_STRENGTH_CLAIM
  - GLOBAL_DESCRIPTIVE_SIZE_OF_TOOTHBRUSH_HEAD_CLAIM
  - GLOBAL_METHOD_OF_APPLICATION_DISPENSE
# How many of the page's image URLs to try, in the extractor's order
# (og:image first). One usually suffices; the second covers an og:image
# that is a site logo or a dead asset.
image_candidates: 2

# Evidence-silent defaults MEASURED on `dev` where the coders' practice
# contradicts the guideline's written default (or where the guideline names
# none and the coders use a value, never a blank). Rendered into the prompt
# after the guideline as the value to use when the evidence is silent. The
# guideline text itself is never edited — it is the organizers'. Numbers
# from `uv run python -m nimo.characteristics` over the 412 labelled rows,
# 2026-09-12; the mechanism is `specs/characteristics.md` §2a.
practice_defaults:
  GLOBAL_IF_WITH_FLUORIDE:
    value: WITH FLUORIDE
    evidence: >-
      the guideline names WITHOUT FLUORIDE as the default, but the labelled
      data codes WITH FLUORIDE on 123 of 148 applicable rows, including rows
      whose page never mentions fluoride; WITHOUT FLUORIDE is used only when
      the product states it is fluoride-free
  GLOBAL_FLAVOUR_FRAGRANCE_INGREDIENT_GROUP:
    value: NOT STATED
    evidence: >-
      the guideline names no default; the labelled data codes NOT STATED on
      113 of 278 applicable rows and never leaves the value blank

# Values the validator refuses are sent back ONCE with the allowed set
# listed (`03` §4 stage 6 step 3: "retried once, then EMPTY"). This is the
# value-level retry; the JSON-shape retry is the client's own (`04` §7).
max_value_retries: 1
