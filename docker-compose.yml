# Self-hosted SearxNG for P7 candidate generation.
#
# `03` §4 stage 2: "SearxNG, self-hosted (`docker compose`, pinned image tag).
# Never call public instances — rate limits and non-reproducibility."
#
# Bring up with:   docker compose up -d searxng
# Then set        SEARXNG_BASE_URL=http://localhost:8080   in .env
#
# NOT YET RUN on this machine: Docker CLI 29.7.2 and Compose v5.3.1 are
# installed but the daemon is not running, so P7's Recall@20 gate is deferred
# rather than measured. `specs/retrieval.md` §1 has the full status.

services:
  searxng:
    # Pinned by tag AND digest, never `latest` — an upstream image change would
    # silently alter which engines answer and in what order, which is exactly
    # the reproducibility problem self-hosting exists to solve. The digest is
    # what actually pins it: a tag can be repointed, a digest cannot.
    #
    # Verified by `docker pull` on 2026-09-11, not copied from documentation.
    # An earlier version of this file carried an invented tag
    # (`2025.9.1-9c62a1a3f`) that does not exist and would have failed on the
    # first `docker compose up` — see `02-decision-log.md`.
    image: searxng/searxng:2026.9.10-931fd9787@sha256:2fb0fa85096fe6df5c3ab98ecb4d6e0ee2ef66b8fb96ce6fce0f75b51c4bd90a
    container_name: nimo-searxng
    ports:
      - "8080:8080"
    volumes:
      - ./config/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      # A single-user local instance. No secret is baked into the repo; if the
      # image asks for one, generate it into .env (gitignored) — `04` §9.
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
